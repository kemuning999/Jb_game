<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="fcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c12" />
      <stop offset="50%" stop-color="#052e1f" />
      <stop offset="100%" stop-color="#01140d" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#fcBg)" />

  <circle cx="660" cy="140" r="160" fill="#10b981" opacity="0.2" filter="blur(40px)" />

  <rect x="40" y="40" width="130" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
  <text x="105" y="62" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="2">EA FC MOBILE</text>

  <rect x="185" y="40" width="115" height="34" rx="17" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
  <text x="242" y="62" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" text-anchor="middle">TEST ORDER</text>

  <text x="40" y="145" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900">STARTER FC MOBILE OVR 85</text>
  <text x="40" y="185" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="600">Starter Squad OVR 85 • 2.000.000 Koin • Bind EA Akun</text>

  <g transform="translate(40, 220)">
    <rect x="0" y="0" width="140" height="75" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="70" y="32" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">OVR UTAMA</text>
    <text x="70" y="58" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" text-anchor="middle">OVR 85</text>

    <rect x="155" y="0" width="140" height="75" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="225" y="32" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">KOIN PASAR</text>
    <text x="225" y="58" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" text-anchor="middle">2.000.000</text>

    <rect x="310" y="0" width="140" height="75" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="380" y="32" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BIND AKUN</text>
    <text x="380" y="58" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" text-anchor="middle">EA ACCOUNT</text>
  </g>

  <!-- Player Card Shield Visual -->
  <g transform="translate(560, 150)">
    <path d="M20,10 L140,10 L150,130 L80,180 L10,130 Z" fill="url(#emeraldGrad)" stroke="#34d399" stroke-width="3" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.5))" />
    <text x="80" y="70" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="36" font-weight="900" text-anchor="middle">85</text>
    <text x="80" y="100" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" text-anchor="middle">OVR</text>
    <text x="80" y="145" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">STARTER</text>
  </g>

  <rect x="0" y="420" width="800" height="80" fill="#000000" fill-opacity="0.4" />
  <text x="40" y="468" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600">HARGA TEST PEMBELIAN</text>
  <text x="760" y="470" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="30" font-weight="900" text-anchor="end">Rp 2.500</text>
</svg>