<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="ffBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0a05" />
      <stop offset="50%" stop-color="#2d1307" />
      <stop offset="100%" stop-color="#0d0402" />
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#ffBg)" />

  <!-- Diagonal Tech Stripes -->
  <g opacity="0.08" stroke="#f97316" stroke-width="2">
    <line x1="-100" y1="500" x2="500" y2="-100" />
    <line x1="-50" y1="500" x2="550" y2="-100" />
    <line x1="0" y1="500" x2="600" y2="-100" />
    <line x1="200" y1="500" x2="800" y2="-100" />
    <line x1="400" y1="500" x2="1000" y2="-100" />
  </g>

  <circle cx="650" cy="150" r="160" fill="#ea580c" opacity="0.25" filter="blur(50px)" />

  <rect x="40" y="40" width="120" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
  <text x="100" y="62" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="2">FREE FIRE</text>

  <rect x="175" y="40" width="115" height="34" rx="17" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5" />
  <text x="232" y="62" fill="#f87171" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" text-anchor="middle">TEST ORDER</text>

  <text x="40" y="145" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900">STARTER AKUN FREE FIRE</text>
  <text x="40" y="185" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="600">Level 10 • Ready Ranked • Bundle Pemula & Karakter</text>

  <g transform="translate(40, 220)">
    <rect x="0" y="0" width="140" height="75" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="70" y="32" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">LEVEL AKUN</text>
    <text x="70" y="58" fill="#fb923c" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" text-anchor="middle">LEVEL 10</text>

    <rect x="155" y="0" width="140" height="75" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="225" y="32" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">STATUS BIND</text>
    <text x="225" y="58" fill="#f87171" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" text-anchor="middle">GOOGLE KOSONG</text>

    <rect x="310" y="0" width="140" height="75" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="380" y="32" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PENGIRIMAN</text>
    <text x="380" y="58" fill="#4ade80" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" text-anchor="middle">OTOMATIS</text>
  </g>

  <!-- Gun Silhouette Symbol -->
  <g transform="translate(520, 160)">
    <rect x="0" y="0" width="220" height="130" rx="20" fill="url(#fireGrad)" opacity="0.9" filter="drop-shadow(0 15px 30px rgba(220,38,38,0.4))" />
    <!-- Stylized FF Crosshair / Skull -->
    <circle cx="110" cy="55" r="32" fill="#ffffff" fill-opacity="0.2" />
    <circle cx="110" cy="55" r="14" fill="#ffffff" />
    <line x1="110" y1="15" x2="110" y2="95" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="70" y1="55" x2="150" y2="55" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <text x="110" y="112" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1">SURVIVOR READY</text>
  </g>

  <rect x="0" y="420" width="800" height="80" fill="#000000" fill-opacity="0.4" />
  <text x="40" y="468" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600">HARGA TEST PEMBELIAN</text>
  <text x="760" y="470" fill="#fb923c" font-family="'Plus Jakarta Sans', sans-serif" font-size="30" font-weight="900" text-anchor="end">Rp 1.000</text>
</svg>