<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="gtaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140c1d" />
      <stop offset="50%" stop-color="#241433" />
      <stop offset="100%" stop-color="#0a050f" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#gtaBg)" />

  <circle cx="660" cy="140" r="170" fill="#a855f7" opacity="0.2" filter="blur(40px)" />

  <rect x="40" y="40" width="130" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
  <text x="105" y="62" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="2">GTA V ONLINE</text>

  <rect x="185" y="40" width="115" height="34" rx="17" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1.5" />
  <text x="242" y="62" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" text-anchor="middle">TEST ORDER</text>

  <text x="40" y="145" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900">GTA V ONLINE STARTER PACK</text>
  <text x="40" y="185" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="600">Rank 25 • $2.000.000 Cash • Apartemen Standar • PC Ready</text>

  <g transform="translate(40, 220)">
    <rect x="0" y="0" width="140" height="75" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="70" y="32" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">RANK LEVEL</text>
    <text x="70" y="58" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" text-anchor="middle">RANK 25</text>

    <rect x="155" y="0" width="140" height="75" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="225" y="32" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">UANG CASH</text>
    <text x="225" y="58" fill="#4ade80" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" text-anchor="middle">$2.000.000</text>

    <rect x="310" y="0" width="140" height="75" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="380" y="32" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PLATFORM</text>
    <text x="380" y="58" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" text-anchor="middle">PC / EPIC</text>
  </g>

  <!-- GTA V Style Roman Five -->
  <g transform="translate(560, 150)">
    <rect x="10" y="10" width="150" height="150" rx="30" fill="url(#purpleGrad)" opacity="0.9" filter="drop-shadow(0 15px 30px rgba(168,85,247,0.4))" />
    <text x="85" y="115" fill="#ffffff" font-family="'Impact', 'Plus Jakarta Sans', sans-serif" font-size="100" font-weight="900" text-anchor="middle">V</text>
  </g>

  <rect x="0" y="420" width="800" height="80" fill="#000000" fill-opacity="0.4" />
  <text x="40" y="468" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600">HARGA TEST PEMBELIAN</text>
  <text x="760" y="470" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="30" font-weight="900" text-anchor="end">Rp 5.000</text>
