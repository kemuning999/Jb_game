<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad25" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051f12" />
      <stop offset="60%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad25" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="800" height="500" fill="url(#bgGrad25)" />

  <!-- Ambient Glow -->
  <circle cx="400" cy="240" r="160" fill="#22c55e" opacity="0.12" filter="blur(60px)" />
  <circle cx="700" cy="80" r="120" fill="#84cc16" opacity="0.1" filter="blur(50px)" />

  <!-- Tech Grid Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5" fill="none">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Big Central Icon Art -->
  <circle cx="400" cy="240" r="70" fill="#ffffff" fill-opacity="0.1" stroke="#22c55e" stroke-width="6" /><polygon points="400,215 425,230 415,258 385,258 375,230" fill="#22c55e" />

  <!-- Top Badges -->
  <g transform="translate(40, 40)">
    <!-- Category Pill -->
    <rect width="180" height="38" rx="19" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />
    <text x="90" y="24" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif, system-ui" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="2">FC MOBILE</text>
  </g>

  <g transform="translate(235, 40)">
    <!-- Instant Delivery Pill -->
    <rect width="150" height="38" rx="19" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
    <text x="75" y="24" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif, system-ui" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">⚡ AUTO QRIS</text>
  </g>

  <!-- Price Badge (Top Right) -->
  <g transform="translate(620, 40)">
    <rect width="140" height="38" rx="19" fill="url(#accentGrad25)" />
    <text x="70" y="24" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif, system-ui" font-size="13" font-weight="900" text-anchor="middle">Rp 5.000</text>
  </g>

  <!-- Bottom Info Container -->
  <rect x="40" y="380" width="720" height="85" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />

  <text x="70" y="418" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif, system-ui" font-size="20" font-weight="900" letter-spacing="0.5">EDISI AKUN #25 • LEGENDARY SULTAN</text>
  <text x="70" y="445" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif, system-ui" font-size="13" font-weight="600">Garansi Anti Hackback 100% • Monsep Clean Bind • Instant Delivery</text>

  <!-- Verified Watermark Icon -->
  <g transform="translate(710, 405)">
    <circle cx="15" cy="15" r="16" fill="#10b981" />
    <path d="M9 15 L13 19 L21 11" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>