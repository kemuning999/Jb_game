<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="rbxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#141c2e" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="rbxRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#rbxBg)" />

  <circle cx="670" cy="130" r="170" fill="#38bdf8" opacity="0.2" filter="blur(40px)" />
  <circle cx="150" cy="380" r="140" fill="#ef4444" opacity="0.15" filter="blur(40px)" />

  <rect x="40" y="40" width="110" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
  <text x="95" y="62" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="2">ROBLOX</text>

  <rect x="165" y="40" width="115" height="34" rx="17" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
  <text x="222" y="62" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" text-anchor="middle">TEST ORDER</text>

  <text x="40" y="145" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900">STARTER AKUN ROBLOX</text>
  <text x="40" y="185" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="600">Unverified Email & No PIN • 50 Robux Avatar • Clean Hand</text>

  <g transform="translate(40, 220)">
    <rect x="0" y="0" width="140" height="75" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="70" y="32" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">STATUS EMAIL</text>
    <text x="70" y="58" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" text-anchor="middle">UNVERIFIED</text>

    <rect x="155" y="0" width="140" height="75" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="225" y="32" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">STATUS PIN</text>
    <text x="225" y="58" fill="#4ade80" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" text-anchor="middle">NO PIN (AMAN)</text>

    <rect x="310" y="0" width="140" height="75" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="380" y="32" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">GARANSI</text>
    <text x="380" y="58" fill="#f43f5e" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" text-anchor="middle">SEUMUR HIDUP</text>
  </g>

  <!-- Tilted Roblox Block / Cube -->
  <g transform="translate(560, 160)">
    <rect x="20" y="20" width="120" height="120" rx="26" fill="url(#rbxRed)" transform="rotate(-12 80 80)" filter="drop-shadow(0 15px 30px rgba(239,68,68,0.4))" />
    <!-- Square Hole in Roblox logo -->
    <rect x="62" y="62" width="36" height="36" rx="8" fill="#0b0f19" transform="rotate(-12 80 80)" />
  </g>

  <rect x="0" y="420" width="800" height="80" fill="#000000" fill-opacity="0.4" />
  <text x="40" y="468" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600">HARGA TEST PEMBELIAN</text>
  <text x="760" y="470" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="30" font-weight="900" text-anchor="end">Rp 1.500</text>
</svg>